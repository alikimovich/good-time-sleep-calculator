# LKM-652: the UI-test runner scripts/perf drives both Good Time apps with. Generated with xcodegen into a
# scratch directory; nothing here builds into either app. The tests launch the installed app by its bundle ID
# (com.alikimovich.good-time-to-sleep), so the same taps reach the SwiftUI app and the Exact app.
name: GTPerfRunner
options:
  bundleIdPrefix: com.alikimovich.gtperf
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
targets:
  GTPerfHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alikimovich.gtperf.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  GTPerfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GTPerfHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alikimovich.gtperf.uitests
        TEST_TARGET_NAME: GTPerfHost
schemes:
  GTPerfUITests:
    build:
      targets:
        GTPerfHost: all
        GTPerfUITests: [test]
    test:
      targets: [GTPerfUITests]
